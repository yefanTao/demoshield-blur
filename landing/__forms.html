<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Netlify Forms Declaration</title></head>
<body>
  <form name="demoshield-pro-waitlist" netlify netlify-honeypot="bot-field" hidden>
    <input type="email" name="email" />
    <select name="interest">
      <option value="free-cws-notify">Notify</option>
      <option value="pro-9-lifetime">Pro $9</option>
      <option value="team-29-pack">Team $29</option>
      <option value="support-question">Support</option>
    </select>
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
